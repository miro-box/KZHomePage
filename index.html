<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>昭鸢笺</title>
    <meta name="description" content="昭鸢笺的个人主页：技术调试的点滴、零散思绪与沿途所见。">
    <meta name="keywords" content="昭鸢笺,个人主页,博客,技术,galgame,番剧">
    <meta name="theme-color" content="#3d5a80">
    <meta name="color-scheme" content="light dark">

    <!-- 分享链接时的预览卡片（微信、Telegram、X 等）。主页域名不是 mibase.top 的话请改这几处 -->
    <link rel="canonical" href="https://mibase.top/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="昭鸢笺">
    <meta property="og:description" content="鸢起云间，一纸笺藏见闻。">
    <meta property="og:url" content="https://mibase.top/">
    <meta property="og:image" content="https://mibase.top/static/images/bg.webp">

    <!-- 浏览器标签上显示的图标：请换成你自己的图片 -->
    <link rel="icon" href="./static/images/favicon.png">
    <!-- 背景图是首屏最大的元素，提前加载 -->
    <link rel="preload" as="image" href="./static/images/bg.webp" fetchpriority="high">

    <!-- 字体：直接使用博客站点上的同一套文件，和博客保持一致（需要博客的 /fonts/ 允许跨域，见 _headers） -->
    <link rel="preconnect" href="https://blog.mibase.top" crossorigin>
    <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://blog.mibase.top/fonts/HarmonyOS-Sans-sub.woff2">
    <!-- 正文字体（霞鹜文楷，按需加载的切片版）：异步加载，不阻塞首屏 -->
    <link rel="preload" href="https://blog.mibase.top/fonts/lxgw/lxgwwenkai-regular.css" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://blog.mibase.top/fonts/lxgw/lxgwwenkai-regular.css">
    </noscript>

    <style>
        /* 标题和按钮：HarmonyOS Sans（精简版，和博客标题字体相同） */
        @font-face {
            font-family: 'HarmonyOS Sans';
            src: url('https://blog.mibase.top/fonts/HarmonyOS-Sans-sub.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --font-modern: "HarmonyOS Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            --font-literary: "LXGW WenKai", "Songti SC", "Noto Serif SC", serif;

            --accent: #3d5a80;
            --text: #1f2937;
            --muted: #4b5563;
            --card: rgba(255, 255, 255, 0.76);
            --card-border: rgba(255, 255, 255, 0.6);
            --btn-text: #ffffff;
            --body-bg: #cfd8e3; /* 浅色模式背景 */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #8fb3e0;
                --text: #f3f4f6;
                --muted: #cbd5e1;
                --card: rgba(17, 24, 39, 0.66);
                --card-border: rgba(255, 255, 255, 0.14);
                --btn-text: #0b1220;
                --body-bg: #0f172a; /* 深色模式背景，防止白屏闪烁 */
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            display: flex;
            align-items: center;
            font-family: var(--font-literary);
            color: var(--text);
            background: var(--body-bg);
        }

        /* 电脑端背景图定位 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -2;
            background: url("./static/images/bg.webp") 62% 30% / cover no-repeat;
        }

        /* 电脑端左侧加一层很淡的渐变，让卡片和背景过渡更自然 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.16), rgba(15, 23, 42, 0) 55%);
        }

        .card {
            width: min(520px, 100%);
            margin-left: clamp(0px, 8vw, 140px);
            padding: 34px 34px 26px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--card-border);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.22);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            backdrop-filter: blur(14px) saturate(1.2);
            animation: rise 0.6s ease both;
        }

        .head {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .avatar {
            width: 76px;
            height: 76px;
            flex: none;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.2);
        }

        h1 {
            margin: 0 0 4px;
            font-family: var(--font-modern);
            font-weight: 700;
            font-size: clamp(1.8rem, 6vw, 2.4rem);
            letter-spacing: 0.12em;
            line-height: 1.2;
            color: var(--accent);
        }

        .tagline {
            margin: 0;
            font-size: 1rem;
            color: var(--text);
        }

        .intro {
            margin: 0;
            line-height: 1.85;
            font-size: 0.95rem;
            color: var(--muted);
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 24px 0 6px;
        }

        .btn {
            flex: 1 1 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--accent);
            text-decoration: none;
            font-family: var(--font-modern);
            font-weight: 500;
            color: var(--btn-text);
            background: var(--accent);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: rise 0.5s ease both;
            animation-delay: calc(0.2s + var(--i, 0) * 0.07s);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn.ghost {
            color: var(--accent);
            background: transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        <footer>&copy; 2023-2026 昭鸢笺</footer>

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card,
            .btn {
                animation: none;
                transition: none;
            }
        }
/* 手机：卡片沉到底部居中，使用手机专属竖图 */
        @media (max-width: 700px) {
            body {
                padding: 16px;
                align-items: flex-end;
                justify-content: center;
            }

            /* 📱 手机端背景图定位：将垂直百分比调大（如 80%），把图片向上推 */
            body::before {
                background-image: url("./static/images/bg-m.webp");
                background-size: 135%;
                background-position: center 100%; /* 垂直方向调大到 80%~90%，图片会明显向上移 */
                background-repeat: no-repeat;
            }

            body::after {
                background: linear-gradient(0deg, rgba(15, 23, 42, 0.18), rgba(15, 23, 42, 0) 60%);
            }

            .card {
                width: 100%;
                margin-left: 0;
                padding: 24px 20px 18px;
            }

            .avatar {
                width: 64px;
                height: 64px;
            }

            .btn {
                flex-basis: 100%;
            }
        }
        /* === 页面加载动画样式 === */
        #loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: var(--body-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loader {
            display: block;
            --height-of-loader: 4px;
            --loader-color: var(--accent);
            width: 140px;
            height: var(--height-of-loader);
            border-radius: 30px;
            background-color: rgba(128, 128, 128, 0.25);
            position: relative;
            margin-bottom: 16px;
        }

        .loader::before {
            content: "";
            position: absolute;
            background: var(--loader-color);
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            border-radius: 30px;
            animation: moving 1s ease-in-out infinite;
        }

        @keyframes moving {
            50% {
                width: 100%;
            }
            100% {
                width: 0;
                right: 0;
                left: unset;
            }
        }

        .loading-text {
            font-size: 0.85rem;
            color: var(--muted);
            font-family: var(--font-literary);
            letter-spacing: 2px;
        }

        body.loaded #loading-mask {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>

<body>
    <!-- 页面加载动画遮罩 -->
    <div id="loading-mask">
        <div class="loader"></div>
        <div class="loading-text">昭鸢笺 · 笺册渐启…</div>
    </div>

    <main class="card">
        <div class="head">
            <!-- 头像：请放一张 avatar.webp（正方形，256x256 即可）；文件不存在时会自动隐藏 -->
            <img class="avatar" src="./static/images/avatar.webp" width="76" height="76" alt="昭鸢笺的头像"
                decoding="async" onerror="this.style.display='none'">
            <div>
                <h1>昭鸢笺</h1>
                <p class="tagline">鸢起云间，一纸笺藏见闻。</p>
            </div>
        </div>

        <p class="intro">
            昭有明朗向远之意，鸢乘风而上，笺以载笔墨见闻。这里是我的线上手记，记录技术调试的点滴、零散思绪与沿途所见。
        </p>

        <nav class="links" aria-label="站点链接">
            <a class="btn" style="--i:0" href="https://blog.mibase.top">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
                    <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" />
                    <path d="M3 6l0 13" />
                    <path d="M12 6l0 13" />
                    <path d="M21 6l0 13" />
                </svg>
                博客
            </a>
            <a class="btn ghost" style="--i:1" href="https://github.com/miro-box" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 8l-4 4l4 4" />
                    <path d="M17 8l4 4l-4 4" />
                    <path d="M14 4l-4 16" />
                </svg>
                GitHub
            </a>
            <a class="btn ghost" style="--i:2" href="mailto:hi@mibase.top">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M3 7l9 6l9 -6" />
                </svg>
                联系方式
            </a>
        </nav>

        <footer>&copy; 2023-2026 昭鸢笺</footer>
    </main>

    <!-- 同步等待页面资源与字体加载完毕后，再淡出遮罩（彻底解决字体加载撕裂感） -->
    <script>
        (function() {
            var pageLoaded = new Promise(function(resolve) {
                if (document.readyState === 'complete') {
                    resolve();
                } else {
                    window.addEventListener('load', resolve);
                }
            });

            var fontLoaded = document.fonts ? document.fonts.ready : Promise.resolve();

            Promise.all([pageLoaded, fontLoaded]).then(function() {
                setTimeout(function() {
                    document.body.classList.add('loaded');
                }, 100);
            });
        })();
    </script>
</body>

</html>
